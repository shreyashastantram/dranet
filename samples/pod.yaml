apiVersion: v1
kind: Pod
metadata:
  name: nginx-pn-test
  namespace: default
  annotations:
    # Reference to the ACN PodNetwork
    multitenancy.acn.azure.com/podNetwork: pn-pon-test
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    ports:
    - containerPort: 80
    resources:
      claims:
      - name: pod-net

  resourceClaims:
  - name: pod-net
    resourceClaimTemplateName: pod-subnet-shared-rct