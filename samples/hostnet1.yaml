apiVersion: v1
kind: Pod
metadata:
  name: hostnet1
  namespace: default
spec:
  hostNetwork: true
  hostPID: true
  nodeName: aks-nodes-12554883-vmss000001
  tolerations:
  - operator: Exists
  containers:
  - name: c
    image: nicolaka/netshoot
    command: [ "sleep", "infinity" ]
    securityContext:
      privileged: true
      capabilities:
        add: [ "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_PTRACE" ]
