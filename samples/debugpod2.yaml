apiVersion: v1
kind: Pod
metadata:
  name: sharedcxsub2-pod2
  namespace: default
  labels:
    kubernetes.azure.com/pod-network-instance: sharedcxsub2-pni
spec:
  containers:
  - name: netshoot
    image: nicolaka/netshoot:latest
    command: [ "sleep", "infinity" ]
    securityContext:
      privileged: true
      capabilities:
        add: [ "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_PTRACE" ]
    resources:
      claims:
      - name: pod-net
  resourceClaims:
  - name: pod-net
    resourceClaimTemplateName: sharedcxsub2-shared-rct
