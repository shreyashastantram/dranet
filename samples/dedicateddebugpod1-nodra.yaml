apiVersion: v1
kind: Pod
metadata:
  name: dedicateddebugpod2
  namespace: default
  labels:
    kubernetes.azure.com/pod-network-instance: cust-pni2
spec:
  containers:
  - name: netshoot
    image: nicolaka/netshoot:latest
    resources:
      limits:
        acn.azure.com/vnet-nic: "1"
    command: [ "sleep", "infinity" ]
    securityContext:
      privileged: true
      capabilities:
        add: [ "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_PTRACE" ]
