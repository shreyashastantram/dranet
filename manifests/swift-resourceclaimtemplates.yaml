---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: default-dedicated-rct
spec:
  spec:
    devices:
      requests:
        - name: nic
          exactly:
            deviceClassName: swift-dedicated-nic  # Requires pristine NIC (subnet="")
            count: 1
            # No capacity specified - uses requestPolicy.default ("1")
      config:
        - requests: ["nic"]
          opaque:
            driver: networking.azure.com
            parameters:
              dedicated: true  # Tells CNS this is dedicated mode
---
